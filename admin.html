<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15304F">
<title>Leads – Himalay admin</title>
<link rel="icon" type="image/png" href="logo/fvicon-icon.png">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<header class="ad-top">
  <img src="logo/himalaya-new-logo.png" alt="Himalay Thermoplast" width="598" height="158">
  <span>Leads</span>
  <button type="button" id="logout" hidden>Sign out</button>
</header>

<main>
  <form id="login" class="ad-card ad-login">
    <h1>Sign in</h1>
    <p>Enter the admin key. It stays in this browser tab only.</p>
    <label>Admin key<input id="key" type="password" autocomplete="current-password" required></label>
    <button type="submit">Open leads</button>
    <p class="ad-msg" id="loginMsg" role="alert"></p>
  </form>

  <section id="app" hidden>
    <div class="ad-bar">
      <div class="ad-tabs" role="tablist" id="tabs">
        <button type="button" data-s="" aria-pressed="true">All <b id="c-all"></b></button>
        <button type="button" data-s="new" aria-pressed="false">New <b id="c-new"></b></button>
        <button type="button" data-s="contacted" aria-pressed="false">Contacted <b id="c-contacted"></b></button>
        <button type="button" data-s="closed" aria-pressed="false">Closed <b id="c-closed"></b></button>
        <button type="button" data-s="spam" aria-pressed="false">Spam <b id="c-spam"></b></button>
      </div>
      <div class="ad-acts">
        <button type="button" id="refresh">Refresh</button>
        <button type="button" id="csv">Download CSV</button>
      </div>
    </div>
    <p class="ad-msg" id="msg" role="status" aria-live="polite"></p>
    <div class="ad-list" id="list"></div>
  </section>
</main>
<script src="js/admin.js" defer></script>
</body>
</html>
